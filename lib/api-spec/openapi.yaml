openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Student profile operations
  - name: tutor
    description: AI tutor chat operations
  - name: progress
    description: Student progress tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get student profile
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Profile not found
    post:
      operationId: createOrUpdateProfile
      tags: [profile]
      summary: Create or update student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"

  /tutor/sessions:
    get:
      operationId: listSessions
      tags: [tutor]
      summary: List chat sessions for a device
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
    post:
      operationId: createSession
      tags: [tutor]
      summary: Create a new chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"

  /tutor/sessions/{id}:
    get:
      operationId: getSession
      tags: [tutor]
      summary: Get a session with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionWithMessages"
        "404":
          description: Not found
    delete:
      operationId: deleteSession
      tags: [tutor]
      summary: Delete a chat session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /tutor/sessions/{id}/messages:
    post:
      operationId: sendMessage
      tags: [tutor]
      summary: Send a message to the AI tutor (streaming SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "200":
          description: SSE stream of AI tutor response chunks
          content:
            text/event-stream: {}

  /tutor/sessions/{id}/image-messages:
    post:
      operationId: sendImageMessage
      tags: [tutor]
      summary: Send an image (OCR) message to the AI tutor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendImageMessageBody"
      responses:
        "200":
          description: SSE stream of AI tutor response for image question
          content:
            text/event-stream: {}

  /tutor/transcribe:
    post:
      operationId: transcribeAudio
      tags: [tutor]
      summary: Transcribe audio to text using Whisper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeBody"
      responses:
        "200":
          description: Transcribed text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeResponse"

  /tutor/weak-topics/{deviceId}:
    get:
      operationId: getWeakTopics
      tags: [tutor]
      summary: Get weak topics for a student
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of weak topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeakTopic"

  /progress/{deviceId}:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get student progress summary (awards daily login XP on first call each day)
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/{deviceId}/xp:
    post:
      operationId: awardXp
      tags: [progress]
      summary: Award XP to a student
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwardXpBody"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        name:
          type: string
        grade:
          type: string
        board:
          type: string
        subjects:
          type: array
          items:
            type: string
        goal:
          type: string
        preferredLanguage:
          type: string
        voicePersonality:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - name
        - grade
        - board
        - subjects
        - createdAt
        - updatedAt

    UpsertProfileBody:
      type: object
      properties:
        deviceId:
          type: string
        name:
          type: string
        grade:
          type: string
        board:
          type: string
        subjects:
          type: array
          items:
            type: string
        goal:
          type: string
        preferredLanguage:
          type: string
        voicePersonality:
          type: string
      required:
        - deviceId
        - name
        - grade
        - board
        - subjects

    ChatSession:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        subject:
          type: string
        mode:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - subject
        - mode
        - title
        - createdAt
        - updatedAt

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        role:
          type: string
        content:
          type: string
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - role
        - content
        - createdAt

    ChatSessionWithMessages:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        subject:
          type: string
        mode:
          type: string
        title:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - subject
        - mode
        - title
        - messages
        - createdAt
        - updatedAt

    CreateSessionBody:
      type: object
      properties:
        deviceId:
          type: string
        subject:
          type: string
        mode:
          type: string
        title:
          type: string
        grade:
          type: string
        board:
          type: string
      required:
        - deviceId
        - subject
        - mode
        - title
        - grade
        - board

    SendMessageBody:
      type: object
      properties:
        content:
          type: string
        deviceId:
          type: string
        grade:
          type: string
        board:
          type: string
        subject:
          type: string
        mode:
          type: string
      required:
        - content
        - deviceId
        - grade
        - board
        - subject
        - mode

    SendImageMessageBody:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64 encoded image of handwritten or printed question
        deviceId:
          type: string
        grade:
          type: string
        board:
          type: string
        subject:
          type: string
        mode:
          type: string
      required:
        - imageBase64
        - deviceId
        - grade
        - board
        - subject
        - mode

    TranscribeBody:
      type: object
      properties:
        audioBase64:
          type: string
          description: Base64 encoded audio data
        mimeType:
          type: string
          description: MIME type of the audio (e.g. audio/m4a)
      required:
        - audioBase64

    TranscribeResponse:
      type: object
      properties:
        text:
          type: string
          description: Transcribed text from the audio
      required:
        - text

    WeakTopic:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        subject:
          type: string
        topic:
          type: string
        errorCount:
          type: integer
        lastSeenAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - subject
        - topic
        - errorCount

    ProgressSummary:
      type: object
      properties:
        deviceId:
          type: string
        totalXp:
          type: integer
        level:
          type: integer
        streak:
          type: integer
        totalQuestions:
          type: integer
        totalTimeMinutes:
          type: integer
        subjectBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SubjectProgress"
        badges:
          type: array
          items:
            type: string
        lastActiveAt:
          type: string
          format: date-time
      required:
        - deviceId
        - totalXp
        - level
        - streak
        - totalQuestions
        - totalTimeMinutes
        - subjectBreakdown
        - badges

    SubjectProgress:
      type: object
      properties:
        subject:
          type: string
        questionCount:
          type: integer
        xp:
          type: integer
        timeMinutes:
          type: integer
      required:
        - subject
        - questionCount
        - xp
        - timeMinutes

    AwardXpBody:
      type: object
      properties:
        xp:
          type: integer
        subject:
          type: string
        reason:
          type: string
        timeMinutes:
          type: integer
      required:
        - xp
        - subject
