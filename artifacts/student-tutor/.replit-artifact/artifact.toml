kind = "mobile"
previewPath = "/"
title = "AI Student Tutor"
version = "1.0.0"
id = "artifacts/student-tutor"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25494

[services.development]
run = "pnpm --filter @workspace/student-tutor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-tutor", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/student-tutor", "run", "serve" ]

[services.env]
PORT = "25494"
BASE_PATH = "/"
